<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星空与相册</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; }
    
    .modal {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 1000;
      justify-content: center; align-items: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 20px; padding: 30px; max-width: 90vw; max-height: 90vh;
      overflow-y: auto; text-align: center;
      border: 2px solid #ffd700;
      animation: modalIn 0.3s ease;
    }
    @keyframes modalIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-title { color: #ffd700; font-size: 2em; margin-bottom: 20px; }
    .album-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px; padding: 20px;
    }
    .photo-card {
      background: #fff; border-radius: 10px; overflow: hidden;
      transition: transform 0.3s; cursor: pointer;
    }
    .photo-card:hover { transform: scale(1.05); }
    .photo-card img {
      width: 100%; height: 200px; object-fit: cover;
    }
    .photo-caption {
      padding: 10px; background: #333; color: #fff; font-size: 0.9em;
    }
    .close-btn {
      position: absolute; top: 20px; right: 30px;
      font-size: 40px; color: #fff; cursor: pointer; z-index: 1001;
    }
  </style>
</head>
<body>
  <canvas id="space"></canvas>
  
  <div class="modal" id="modal">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <div class="modal-content">
      <h2 class="modal-title">📸 温馨家庭相册</h2>
      <div class="album-grid" id="albumGrid"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('space');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    // Star data
    const stars = [];
    const STAR_COUNT = 200;
    
    for (let i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 2 + 0.5,
        twinkleSpeed: Math.random() * 0.05 + 0.02,
        twinkleOffset: Math.random() * Math.PI * 2,
        isClickable: Math.random() < 0.03, // 3% clickable
        onClicked: function() { openAlbum(); }
      });
    }

    // Mouse parallax
    let mouseX = 0, mouseY = 0;
    let targetX = 0, targetY = 0;
    
    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX - width / 2) / 50;
      mouseY = (e.clientY - height / 2) / 50;
    });

    // Earth rotation
    let earthAngle = 0;
    const earthRadius = 80;
    
    // Couple position
    let coupleX = 0, coupleY = -earthRadius - 20;
    let coupleStep = 0;
    const coupleWalkSpeed = 0.03;

    function drawEarth() {
      earthAngle += 0.005;
      ctx.save();
      ctx.translate(width / 2, height / 2);
      ctx.rotate(earthAngle);
      
      // Ocean
      const gradient = ctx.createRadialGradient(-20, -20, 0, 0, 0, earthRadius);
      gradient.addColorStop(0, '#1e90ff');
      gradient.addColorStop(1, '#0066cc');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(0, 0, earthRadius, 0, Math.PI * 2);
      ctx.fill();
      
      // Continents (simple shapes)
      ctx.fillStyle = '#228b22';
      ctx.beginPath();
      ctx.arc(-30, -20, 25, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(25, 30, 30, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(10, -10, 20, 0, Math.PI * 2);
      ctx.fill();
      
      // Clouds
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath();
      ctx.arc(-10, 10, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(35, -25, 20, 0, Math.PI * 2);
      ctx.fill();
      
      // Atmosphere glow
      const glow = ctx.createRadialGradient(0, 0, earthRadius - 10, 0, 0, earthRadius + 20);
      glow.addColorStop(0, 'rgba(100, 150, 255, 0.3)');
      glow.addColorStop(1, 'rgba(100, 150, 255, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, earthRadius + 20, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.restore();
    }

    function drawCouple() {
      coupleStep += coupleWalkSpeed;
      const walkAmplitude = 5;
      coupleX = Math.sin(coupleStep) * walkAmplitude;
      coupleY = -earthRadius - 20 + Math.sin(coupleStep * 2) * walkAmplitude * 0.5;

      ctx.save();
      ctx.translate(width / 2 + coupleX, height / 2 + coupleY);
      
      // Man character (blue shirt)
      ctx.fillStyle = '#4169e1'; // shirt
      ctx.beginPath(); ctx.arc(-8, -15, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(-10, -5, 8, 20);
      ctx.fillStyle = '#deb887';
      ctx.beginPath(); ctx.arc(-8, 15, 6, 0, Math.PI * 2); ctx.fill(); // legs
      
      // Woman character (pink dress)
      ctx.fillStyle = '#ff69b4'; // dress
      ctx.beginPath(); ctx.arc(8, -15, 10, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0, -5);
      ctx.lineTo(-8, 20); ctx.lineTo(16, 20); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#deb887';
      ctx.beginPath(); ctx.arc(8, 22, 5, 0, Math.PI * 2); ctx.fill(); // feet
      
      ctx.restore();
    }

    function drawStars() {
      const moveX = (targetX - mouseX) * 0.05;
      const moveY = (targetY - mouseY) * 0.05;
      targetX = mouseX;
      targetY = mouseY;
      
      stars.forEach((star, index) => {
        if (!star.isClickable) return;
        
        const brightness = 0.5 + 0.5 * Math.sin(Date.now() * star.twinkleSpeed + star.twinkleOffset);
        ctx.fillStyle = `rgba(255, 255, ${Math.floor(brightness * 200)}, ${brightness})`;
        ctx.beginPath();
        ctx.arc(star.x + moveX, star.y + moveY, star.radius, 0, Math.PI * 2);
        ctx.fill();
        
        // Glow effect
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'yellow';
        ctx.shadowBlur = 0;
      });
    }

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;
      
      stars.forEach(star => {
        if (!star.isClickable) return;
        const dist = Math.hypot(clickX - star.x, clickY - star.y);
        if (dist < star.radius + 5) {
          star.onClicked();
        }
      });
    });

    // Sample photos (using emoji + placeholders)
    const photos = [
      { emoji: '👨‍👩‍👧', caption: '幸福的一家三口' },
      { emoji: '❤️', caption: '相爱的每一天' },
      { emoji: '🏠', caption: '温馨的家' },
      { emoji: '✈️', caption: '旅行回忆' },
      { emoji: '🎂', caption: '生日派对' },
      { emoji: '🌹', caption: '浪漫时刻' },
      { emoji: '📷', caption: '美好瞬间' },
      { emoji: '🥂', caption: '庆祝时光' }
    ];

    function renderAlbum() {
      const grid = document.getElementById('albumGrid');
      grid.innerHTML = '';
      photos.forEach(photo => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.innerHTML = `
          <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
                      height: 200px; display: flex; align-items: center; justify-content: center;
                      font-size: 80px;">${photo.emoji}</div>
          <div class="photo-caption">${photo.caption}</div>
        `;
        grid.appendChild(card);
      });
    }

    function openAlbum() {
      renderAlbum();
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    // Window resize
    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Animation loop
    function animate() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.fillRect(0, 0, width, height);
      
      drawStars();
      drawEarth();
      drawCouple();
      
      requestAnimationFrame(animate);
    }
    
    animate();
    renderAlbum();
  </script>
</body>
</html>
