<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星空与相册</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Segoe UI',sans-serif}
canvas{display:block;position:fixed;top:0;left:0}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:1000;justify-content:center;align-items:center}
.modal.active{display:flex}
.modal-content{background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:20px;padding:30px 50px;max-width:600px;width:90vw;text-align:center;border:2px solid #ffd700;animation:modalIn .3s ease;position:relative}
@keyframes modalIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.photo-display{background:#222;border-radius:12px;overflow:hidden;margin-bottom:15px;min-height:300px;display:flex;align-items:center;justify-content:center;position:relative}
.photo-img{font-size:120px;padding:40px 0}
.photo-label{color:#ffd700;font-size:1.3em;margin-bottom:5px}
.photo-index{color:#aaa;font-size:.9em;margin-bottom:15px}
.nav-row{display:flex;justify-content:center;gap:20px;margin-top:10px}
.nav-btn{background:rgba(255,215,0,0.15);border:1px solid #ffd700;color:#ffd700;padding:8px 24px;border-radius:8px;cursor:pointer;font-size:1.1em;transition:all .2s}
.nav-btn:hover{background:rgba(255,215,0,0.3);transform:scale(1.05)}
.nav-btn:active{transform:scale(.95)}
.close-btn{position:absolute;top:10px;right:20px;font-size:36px;color:#fff;cursor:pointer;z-index:1001;transition:transform .2s}
.close-btn:hover{transform:rotate(90deg)}
</style>
</head>
<body>
<canvas id="space"></canvas>

<div class="modal" id="modal">
  <span class="close-btn" onclick="closeModal()">&times;</span>
  <div class="modal-content">
    <div class="photo-label" id="photoLabel">📸 照片</div>
    <div class="photo-index" id="photoIndex">1 / 12</div>
    <div class="photo-display">
      <div class="photo-img" id="photoImg">🌟</div>
    </div>
    <div class="nav-row">
      <button class="nav-btn" onclick="prevPhoto()">◀ 上一张</button>
      <button class="nav-btn" onclick="nextPhoto()">下一张 ▶</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('space');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;

// ─── Photo data (configurable!) ───
const photoData = [
  { id: 1, label: '我们的第一次约会', color: '#ff6b6b', emoji: '💑' },
  { id: 2, label: '海边日出',      color: '#ffd93d', emoji: '🌅' },
  { id: 3, label: '一起做饭',      color: '#6bcbff', emoji: '🍳' },
  { id: 4, label: '猫咪出生',      color: '#69ff69', emoji: '🐱' },
  { id: 5, label: '求婚时刻',      color: '#ff8cff', emoji: '💍' },
  { id: 6, label: '新年旅行',      color: '#ffa94d', emoji: '✈️' },
  { id: 7, label: '家的第一个圣诞', color: '#ff1493', emoji: '🎄' },
  { id: 8, label: '公园野餐',      color: '#00ffff', emoji: '🧺' },
  { id: 9, label: '看烟花',        color: '#ff6347', emoji: '🎆' },
  { id: 10, label: '雨中散步',     color: '#7fff00', emoji: '☔' },
  { id: 11, label: '一起读书',     color: '#da70d6', emoji: '📚' },
  { id: 12, label: '生日惊喜',     color: '#ffd700', emoji: '🎂' }
];

let currentPhoto = 0;

// ─── Clickable Stars (randomly distributed) ───
const clickableStars = [];
const CLICKABLE_COUNT = photoData.length;
const colors = ['#ff6b6b','#ffd93d','#6bcbff','#ff8cff','#69ff69','#ffa94d','#7ec8e3','#ffd700','#ff1493','#00ffff','#ff6347','#7fff00','#da70d6','#87ceeb'];

// Place clickable stars randomly across the whole canvas area
for (let i = 0; i < CLICKABLE_COUNT; i++) {
  // Avoid the center area where earth is
  let x, y, ok;
  do {
    x = Math.random() * W * 1.2 - W * 0.1;
    y = Math.random() * H * 1.2 - H * 0.1;
    const dx = x - W/2, dy = y - H * 0.75;
    ok = Math.hypot(dx, dy) > 220; // stay away from earth
  } while (!ok);

  clickableStars.push({
    x, y,
    r: 3 + Math.random() * 2,
    color: photoData[i].color,
    breathSpeed: 0.015 + Math.random() * 0.02,
    breathPhase: Math.random() * Math.PI * 2,
    spikeLen: 10 + Math.random() * 8,
    photoIndex: i
  });
}

// ─── Background Stars (lots, random) ───
const bgStars = [];
const BG_COUNT = 600;
for (let i = 0; i < BG_COUNT; i++) {
  bgStars.push({
    x: Math.random() * W * 2.5 - W * 0.75,
    y: Math.random() * H * 2.5 - H * 0.75,
    r: Math.random() * 1.5 + 0.3,
    color: colors[Math.floor(Math.random() * colors.length)]
  });
}

// ─── Meteors ───
let meteors = [];
let meteorTimer = 0;
const meteorColors = ['#ff6b6b','#ffd93d','#6bcbff','#ff8cff','#69ff69','#ffa94d','#ffd700','#ff1493','#00ffff'];

function spawnMeteor() {
  const angle = Math.random() * Math.PI * 0.25 - Math.PI * 0.08;
  const speed = Math.random() * 3 + 2;
  const col = meteorColors[Math.floor(Math.random() * meteorColors.length)];
  meteors.push({
    x: Math.random() * W * 1.5 - W * 0.25,
    y: -Math.random() * H * 0.2,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    life: 1,
    r: Math.random() * 2.5 + 1.5,
    color: col,
    spikeLen: 8 + Math.random() * 6
  });
}

// ─── Mouse parallax ───
let mouseX = 0, mouseY = 0;
let offsetX = 0, offsetY = 0;

document.addEventListener('mousemove', e => {
  mouseX = (e.clientX / W - 0.5) * 2;
  mouseY = (e.clientY / H - 0.5) * 2;
});

// ─── Earth ───
let earthAngle = 0;
const earthR = 180;
const earthCX = W / 2;
const earthCY = H * 0.75;
let walkStep = 0;

function drawEarth() {
  earthAngle += 0.003;
  ctx.save(); ctx.translate(earthCX, earthCY); ctx.rotate(earthAngle);
  const grad = ctx.createRadialGradient(-40,-40,0,0,0,earthR);
  grad.addColorStop(0,'#1e90ff');grad.addColorStop(0.5,'#0077cc');grad.addColorStop(1,'#003366');
  ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,earthR,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2d8a2d';
  ctx.beginPath();ctx.ellipse(-45,-55,38,50,-0.15,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(-25,-80,15,20,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(-35,35,20,45,0.1,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(35,-60,22,20,0.3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(40,0,25,45,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(75,-35,45,32,0.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(65,-10,15,20,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(105,-45,10,18,0.1,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(85,55,22,16,0.3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,earthR-15,80,15,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#8B4513';
  const bld=(x,y,w,h)=>{ctx.fillRect(x-w/2,y-h,w,h);ctx.fillStyle='#FFD700';for(let i=0;i<3&&i<h/4;i++)for(let j=0;j<2;j++)ctx.fillRect(x-w/4+j*w/2-2,y-h+4+i*5,3,3);ctx.fillStyle='#8B4513';};
  bld(-30,-75,7,16);bld(-20,-80,5,12);bld(60,-55,6,14);bld(70,-60,4,10);
  bld(50,-25,6,18);bld(60,-30,5,11);bld(35,20,6,14);bld(45,15,5,10);bld(-25,20,5,12);bld(-15,15,4,9);
  ctx.fillStyle='#006400';
  const tree=(x,y,s)=>{ctx.fillStyle='#8B4513';ctx.fillRect(x-2,y,4,s*0.5);ctx.fillStyle='#006400';ctx.beginPath();ctx.arc(x,y-s*0.35,s*0.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x-s*0.35,y-s*0.1,s*0.35,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+s*0.35,y-s*0.1,s*0.35,0,Math.PI*2);ctx.fill();};
  tree(-55,-70,9);tree(-40,-65,7);tree(65,-50,8);tree(80,-55,6);tree(55,-20,8);tree(45,-35,7);tree(-25,-45,6);tree(30,25,7);tree(60,40,6);tree(-45,15,6);tree(-35,30,5);
  ctx.fillStyle='#DEB887';
  const house=(x,y,s)=>{ctx.fillRect(x-s/2,y-s*0.5,s,s*0.5);ctx.fillStyle='#8B0000';ctx.beginPath();ctx.moveTo(x-s/2-2,y-s*0.5);ctx.lineTo(x,y-s*0.85);ctx.lineTo(x+s/2+2,y-s*0.5);ctx.closePath();ctx.fill();ctx.fillStyle='#FFD700';ctx.fillRect(x-2,y-s*0.25,4,6);ctx.fillStyle='#DEB887';};
  house(5,-85,12);house(75,-45,10);house(-40,-25,10);house(65,30,9);house(-20,35,8);house(90,-50,8);
  ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.beginPath();ctx.arc(-20,20,22,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(0,12,26,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(65,-25,24,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(85,-20,18,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(-50,-40,20,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(50,45,18,0,Math.PI*2);ctx.fill();
  const glow=ctx.createRadialGradient(0,0,earthR-20,0,0,earthR+40);
  glow.addColorStop(0,'rgba(100,180,255,0.2)');glow.addColorStop(1,'rgba(100,180,255,0)');
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,0,earthR+40,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawCharacters() {
  walkStep+=0.04;
  const bob=Math.sin(walkStep*2)*2,sway=Math.sin(walkStep)*3,bx=earthCX-35,by=earthCY-earthR-12;
  ctx.save();ctx.translate(bx+sway,by+bob);
  ctx.fillStyle='#4169e1';ctx.beginPath();ctx.moveTo(-9,-8);ctx.lineTo(-9,18);ctx.lineTo(9,18);ctx.lineTo(9,-8);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(-4,-8,8,3);
  ctx.fillStyle='#f5cba7';ctx.beginPath();ctx.arc(0,-19,13,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4a3728';ctx.beginPath();ctx.arc(0,-25,13,Math.PI,0);ctx.fill();ctx.fillRect(-13,-25,26,5);
  ctx.fillStyle='#2c3e50';ctx.beginPath();ctx.arc(-4,-19,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(4,-19,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-3,-20,1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(5,-20,1,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#4a3728';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-7,-23);ctx.lineTo(-2,-22);ctx.stroke();ctx.beginPath();ctx.moveTo(2,-22);ctx.lineTo(7,-23);ctx.stroke();
  ctx.fillStyle='#e8b88a';ctx.beginPath();ctx.arc(0,-16,1.5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#c0392b';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,-14,5,0.2,Math.PI-0.2);ctx.stroke();
  ctx.strokeStyle='#2c3e50';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-4,18);ctx.lineTo(-7,32);ctx.stroke();ctx.beginPath();ctx.moveTo(4,18);ctx.lineTo(7,32);ctx.stroke();
  ctx.fillStyle='#2c3e50';ctx.beginPath();ctx.ellipse(-7,32,6,3.5,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(7,32,6,3.5,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#f5cba7';ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(-10,-2);ctx.lineTo(-19,7);ctx.stroke();ctx.beginPath();ctx.moveTo(10,-2);ctx.lineTo(19,7);ctx.stroke();
  ctx.restore();
  ctx.save();ctx.translate(bx+35-sway,by-5+bob*0.8);
  ctx.fillStyle='#ff69b4';ctx.beginPath();ctx.moveTo(-13,-8);ctx.lineTo(-18,24);ctx.lineTo(18,24);ctx.lineTo(13,-8);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ff85c8';ctx.beginPath();ctx.moveTo(-10,-8);ctx.lineTo(-10,1);ctx.lineTo(10,1);ctx.lineTo(10,-8);ctx.closePath();ctx.fill();
  ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(0,-2,2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f5cba7';ctx.beginPath();ctx.arc(0,-19,12,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#8B4513';ctx.beginPath();ctx.arc(0,-24,12,Math.PI,0);ctx.fill();ctx.fillRect(-12,-24,24,6);ctx.fillRect(-13,-18,4,14);ctx.fillRect(9,-18,4,14);
  ctx.fillStyle='#ff1493';ctx.beginPath();ctx.arc(10,-26,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(10,-26,2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2c3e50';ctx.beginPath();ctx.arc(-4,-19,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(4,-19,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-3,-20,1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(5,-20,1,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-6,-21);ctx.lineTo(-4,-22);ctx.stroke();ctx.beginPath();ctx.moveTo(6,-21);ctx.lineTo(4,-22);ctx.stroke();
  ctx.fillStyle='rgba(255,150,150,0.3)';ctx.beginPath();ctx.arc(-7,-16,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(7,-16,3,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#c0392b';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,-14,4,0.2,Math.PI-0.2);ctx.stroke();
  ctx.strokeStyle='#f5cba7';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-5,24);ctx.lineTo(-6,34);ctx.stroke();ctx.beginPath();ctx.moveTo(5,24);ctx.lineTo(6,34);ctx.stroke();
  ctx.fillStyle='#ff69b4';ctx.beginPath();ctx.ellipse(-6,34,6,3,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(6,34,6,3,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#f5cba7';ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(-13,-2);ctx.lineTo(-21,6);ctx.stroke();ctx.beginPath();ctx.moveTo(13,-2);ctx.lineTo(21,6);ctx.stroke();
  ctx.restore();
  ctx.save();const cb=Math.sin(walkStep*2.5)*2.5,cs=Math.sin(walkStep*1.2)*2.5;ctx.translate(bx+65-cs,by+10+cb);
  ctx.fillStyle='#ff8c00';ctx.beginPath();ctx.ellipse(0,0,9,7,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(9,-4,7,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(4,-10);ctx.lineTo(6,-16);ctx.lineTo(10,-9);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(11,-10);ctx.lineTo(13,-16);ctx.lineTo(16,-9);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffb6c1';ctx.beginPath();ctx.moveTo(5.5,-10);ctx.lineTo(6,-14);ctx.lineTo(9,-9);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(12,-10);ctx.lineTo(13,-14);ctx.lineTo(15,-9);ctx.closePath();ctx.fill();
  ctx.fillStyle='#2c3e50';ctx.beginPath();ctx.arc(7,-4,1.8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(11,-4,1.8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(7.5,-5,0.7,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(11.5,-5,0.7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff69b4';ctx.beginPath();ctx.arc(9,-1.5,1.2,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#333';ctx.lineWidth=.5;ctx.beginPath();ctx.arc(8,0,1,0,Math.PI);ctx.stroke();ctx.beginPath();ctx.arc(10,0,1,0,Math.PI);ctx.stroke();
  ctx.beginPath();ctx.moveTo(4,-2);ctx.lineTo(-1,-4);ctx.stroke();ctx.beginPath();ctx.moveTo(4,-1);ctx.lineTo(-1,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(14,-2);ctx.lineTo(19,-4);ctx.stroke();ctx.beginPath();ctx.moveTo(14,-1);ctx.lineTo(19,0);ctx.stroke();
  ctx.strokeStyle='#ff8c00';ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(-9,0);ctx.quadraticCurveTo(-16,-10,-12,-16);ctx.stroke();
  ctx.fillStyle='#ffb347';ctx.beginPath();ctx.arc(-12,-16,2,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#ff8c00';ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(-4,7);ctx.lineTo(-5,13);ctx.stroke();ctx.beginPath();ctx.moveTo(4,7);ctx.lineTo(5,13);ctx.stroke();
  ctx.beginPath();ctx.moveTo(8,7);ctx.lineTo(9,13);ctx.stroke();ctx.beginPath();ctx.moveTo(12,7);ctx.lineTo(13,13);ctx.stroke();
  ctx.fillStyle='#ffb347';ctx.beginPath();ctx.ellipse(-5,13,2.5,1.5,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(5,13,2.5,1.5,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(9,13,2.5,1.5,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(13,13,2.5,1.5,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#cc6600';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-3,-3);ctx.lineTo(-3,3);ctx.stroke();ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(0,3);ctx.stroke();ctx.beginPath();ctx.moveTo(3,-3);ctx.lineTo(3,3);ctx.stroke();
  ctx.restore();
}

// ─── Draw star ───
function drawStarShape(x,y,r,spikeLen,color,alpha) {
  ctx.save();ctx.translate(x,y);
  const glow=ctx.createRadialGradient(0,0,0,0,0,r*8);
  const aH=Math.floor(alpha*80).toString(16).padStart(2,'0');
  glow.addColorStop(0,color+aH);glow.addColorStop(1,color+'00');
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,0,r*8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=color;ctx.globalAlpha=alpha;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=color;ctx.lineWidth=1.2;ctx.globalAlpha=alpha*0.7;
  for(let a=0;a<4;a++){const ang=a*Math.PI/2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(ang)*spikeLen,Math.sin(ang)*spikeLen);ctx.stroke();}
  ctx.globalAlpha=alpha*0.35;ctx.lineWidth=0.8;
  for(let a=0;a<4;a++){const ang=a*Math.PI/2+Math.PI/4;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(ang)*spikeLen*0.5,Math.sin(ang)*spikeLen*0.5);ctx.stroke();}
  ctx.restore();
}

// ─── Background Stars (static, small) ───
function drawBgStars() {
  offsetX += (mouseX*60-offsetX)*0.05;
  offsetY += (mouseY*60-offsetY)*0.05;
  ctx.save();ctx.translate(W/2,H/2);ctx.translate(offsetX,offsetY);ctx.translate(-W/2,-H/2);
  bgStars.forEach(star => {
    ctx.fillStyle=star.color;ctx.globalAlpha=0.3+Math.random()*0.1;
    ctx.beginPath();ctx.arc(star.x,star.y,star.r,0,Math.PI*2);ctx.fill();
  });
  ctx.restore();
}

// ─── Clickable Stars (breathing) ───
function drawClickableStars() {
  const t = Date.now()/1000;
  ctx.save();ctx.translate(W/2,H/2);ctx.translate(offsetX,offsetY);ctx.translate(-W/2,-H/2);
  clickableStars.forEach(star => {
    const breath = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t*star.breathSpeed+star.breathPhase));
    drawStarShape(star.x,star.y,star.r*(0.5+0.5*breath),star.spikeLen*(0.4+0.6*breath),star.color,breath);
  });
  ctx.restore();
}

// ─── Meteors ───
function drawMeteors() {
  meteorTimer++;
  if(meteorTimer>80+Math.random()*150){spawnMeteor();meteorTimer=0;}
  ctx.save();ctx.translate(W/2,H/2);ctx.translate(offsetX,offsetY);ctx.translate(-W/2,-H/2);
  meteors=meteors.filter(m=>m.life>0);
  meteors.forEach(m=>{
    m.x+=m.vx;m.y+=m.vy;m.life-=0.005;
    ctx.save();ctx.globalAlpha=Math.max(0,m.life);
    const g=ctx.createLinearGradient(m.x,m.y,m.x-m.vx*5,m.y-m.vy*5);
    const col=m.color;
    g.addColorStop(0,col+'e6');g.addColorStop(0.3,col+'88');g.addColorStop(1,col+'00');
    ctx.strokeStyle=g;ctx.lineWidth=m.r*2;ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x-m.vx*7,m.y-m.vy*7);ctx.stroke();
    const breath=0.7+0.3*Math.sin(Date.now()/1000*0.05+m.life);
    drawStarShape(m.x,m.y,m.r*(0.6+0.4*breath),m.spikeLen*(0.5+0.5*breath),m.color,0.9);
    ctx.restore();
  });
  ctx.restore();
}

// ─── Click handler ───
canvas.addEventListener('click', e => {
  const rect=canvas.getBoundingClientRect();
  const cx=e.clientX-rect.left,cy=e.clientY-rect.top;
  const rx=cx-offsetX,ry=cy-offsetY;
  clickableStars.forEach(star=>{
    if(Math.hypot(rx-star.x,ry-star.y)<star.r+15) openAlbum(star.photoIndex);
  });
});

// ─── Album ───
function showPhoto(idx) {
  currentPhoto = idx;
  const p = photoData[idx];
  document.getElementById('photoLabel').textContent = `📸 ${p.label}`;
  document.getElementById('photoIndex').textContent = `${idx+1} / ${photoData.length}`;
  document.getElementById('photoImg').textContent = p.emoji;
  document.getElementById('photoImg').style.background = `linear-gradient(135deg, ${p.color}44, ${p.color}22)`;
}

function prevPhoto() { currentPhoto=(currentPhoto-1+photoData.length)%photoData.length; showPhoto(currentPhoto); }
function nextPhoto() { currentPhoto=(currentPhoto+1)%photoData.length; showPhoto(currentPhoto); }
function openAlbum(idx) { showPhoto(idx); document.getElementById('modal').classList.add('active'); }
function closeModal() { document.getElementById('modal').classList.remove('active'); }

window.addEventListener('resize',()=>{W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;});

function animate() {
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(0,0,W,H);
  drawBgStars();drawMeteors();drawClickableStars();drawEarth();drawCharacters();
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
